[project]
name = "ai-character"
version = "0.1.0"
description = "AI personality simulation in Telegram"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "openai>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
    "toml>=0.10",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
