[telegram]
client_type = "bot"          # bot или userbot
# whitelist и owner_chat_id задаются в .env

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
embedding_model = "text-embedding-3-small"

[character]
name = "Yuki"
prompt_file = "data/character_base.md"

[memory]
diary_dir = "data/diary"
vectors_dir = "data/vectors"
working_memory_file = "data/working_memory.md"
contacts_file = "data/contacts.json"
history_db = "data/history.db"
history_max_per_chat = 1000
stat_levels_file = "data/stat_levels.json"

[[relationship_stats]]
name = "trust"
description = "Trust. Grows when person shares vulnerable things, is honest, doesn't manipulate. Drops from lies and manipulation."

[[relationship_stats]]
name = "closeness"
description = "Emotional closeness. Grows from shared interests, care, remembering details. Drops from coldness, rudeness, ignoring messages."

[[relationship_stats]]
name = "tension"
description = "Tension. Grows from conflicts, misunderstandings, hurt feelings. Drops from discussing problems and resolving them. High tension = reluctance to communicate."

[behavior]
random_sleep_chance = 0.01    # шанс случайного AFK (0.0-1.0)
random_sleep_min = 15         # мин длительность AFK (минуты)
random_sleep_max = 120        # макс длительность AFK (минуты)
miss_notification_chance = 0.05  # шанс пропустить уведомление (0.0-1.0)
notification_preview_length = 10  # символов в превью notification
thinking_delay_min = 1.0      # мин thinking delay перед typing (сек)
thinking_delay_max = 3.0      # макс thinking delay перед typing (сек)
batch_window_min = 2.0        # мин время сбора сообщений (сек)
batch_window_max = 5.0        # макс время сбора сообщений (сек)
proactive_interval_min = 27
proactive_chance = 0.5
batch_delay_min = 0.0
batch_delay_max = 5.0
diary_token_trigger = 20000
worker_max_iterations = 20
typing_wpm_min = 30           # мин символов в минуту (медленнее = человечнее)
typing_wpm_max = 200           # макс символов в минуту
typing_min_delay = 2.0         # мин задержка перед отправкой (сек)
typing_max_delay = 15.0        # макс задержка перед отправкой (сек)
follow_up_chance = 0.3         # шанс отправить follow-up сообщение (0.0-1.0)
follow_up_max = 3              # максимум follow-up сообщений подряд
anti_repeat_threshold = 0.75   # порог similarity для anti-repeat (0.0-1.0)
anti_repeat_max_history = 20   # сколько последних ответов хранить
typo_swap_chance = 0.02        # шанс swap соседних символов (0.0-1.0)
typo_neighbor_chance = 0.02    # шанс замены на соседнюю клавишу (0.0-1.0)
typo_correct_chance = 0.57     # шанс автокоррекции опечатки (0.0-1.0)
typo_correct_delay_min = 15.0  # мин задержка перед автокоррекцией (сек)
typo_correct_delay_max = 45.0  # макс задержка перед автокоррекцией (сек)

[night]
enabled = true
start_hour = 1              # 00:00
end_hour = 9                # 08:00
msk_offset = 3              # UTC+3
